<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your role — AI Interview Chat</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="roles-page container narrow">
    <a href="index.html" class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>
        <circle cx="16" cy="16" r="8.5" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="3" fill="var(--accent)"/>
      </svg>
      <span>AI Interview Chat</span>
    </a>
    <h1 class="login-title">What role are you applying for?</h1>
    <p class="body-lg center">Pick the closest match and we'll tailor your practice questions.</p>

    <input type="search" id="roleSearch" class="role-search" placeholder="Search roles…" aria-label="Search roles" autocomplete="off">

    <div id="roleGrid"></div>
    <p class="role-empty hidden" id="roleEmpty">No match. Enter your role below.</p>

    <form id="otherForm" class="role-other">
      <label for="otherInput" class="mono small">Don't see yours?</label>
      <div class="role-other-row">
        <input type="text" id="otherInput" class="role-search" placeholder="Type your role" maxlength="80" required>
        <button type="submit" class="btn btn-accent btn-md">Continue</button>
      </div>
    </form>
  </main>
  <script src="roles.js"></script>
</body>
</html>
