<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — AI Interview Chat</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <a href="index.html" class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>
        <circle cx="16" cy="16" r="8.5" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="3" fill="var(--accent)"/>
      </svg>
      <span>AI Interview Chat</span>
    </a>
    <h1 class="login-title">Welcome back</h1>
    <p class="body-lg center">Log in or create an account to start practicing.</p>
    <button type="button" class="btn btn-white btn-md" id="googleBtn">Continue with Google</button>

    <p class="login-or mono small"><span>or use your email</span></p>

    <div class="login-tabs" role="tablist" aria-label="Email account">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Create an account</button>
    </div>

    <form id="loginForm" class="login-form">
      <label class="mono small" for="liEmail">Email</label>
      <input class="role-search" id="liEmail" name="email" type="email" autocomplete="email" required>
      <label class="mono small" for="liPw">Password</label>
      <input class="role-search" id="liPw" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-accent btn-md">Log in</button>
      <button type="button" class="nav-signout" id="forgotBtn">Forgot password?</button>
    </form>

    <form id="signupForm" class="login-form hidden">
      <label class="mono small" for="suFirst">First name</label>
      <input class="role-search" id="suFirst" name="first" type="text" autocomplete="given-name" maxlength="40" required>
      <label class="mono small" for="suLast">Last name</label>
      <input class="role-search" id="suLast" name="last" type="text" autocomplete="family-name" maxlength="40" required>
      <label class="mono small" for="suEmail">Email</label>
      <input class="role-search" id="suEmail" name="email" type="email" autocomplete="email" required>
      <label class="mono small" for="suPw">Password (8+ characters)</label>
      <input class="role-search" id="suPw" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label class="mono small" for="suConfirm">Confirm password</label>
      <input class="role-search" id="suConfirm" name="confirm" type="password" autocomplete="new-password" required>
      <button type="submit" class="btn btn-accent btn-md">Create account</button>
    </form>
    <p class="login-msg small" id="formMsg" role="alert"></p>
    <a href="index.html" class="login-back">← Back to home</a>
  </main>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
</body>
</html>
