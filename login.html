<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — AI Interview Chat</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="login-top">
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-callback="handleGoogleSignIn"
         data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="signin_with" data-shape="pill"></div>
  </header>
  <main class="login-page">
    <a href="index.html" class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>
        <circle cx="16" cy="16" r="8.5" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="3" fill="var(--accent)"/>
      </svg>
      <span>AI Interview Chat</span>
    </a>
    <h1 class="login-title">Welcome back</h1>
    <p class="body-lg center">Sign in with Google to start practicing.</p>
    <a href="index.html" class="login-back">← Back to home</a>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function handleGoogleSignIn(response) {
      // The ID token is a JWT; decode the payload for display name/email.
      var payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      try { sessionStorage.setItem('aiic_user', JSON.stringify({ name: payload.name, email: payload.email, picture: payload.picture })); } catch (e) {}
      window.location.href = 'index.html#demo';
    }
  </script>
</body>
</html>
