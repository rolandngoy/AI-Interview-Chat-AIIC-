<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — AI Interview Chat</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="iv-page container narrow">
    <header class="iv-head">
      <a href="index.html" class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>
          <circle cx="16" cy="16" r="8.5" stroke="var(--accent)" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="3" fill="var(--accent)"/>
        </svg>
        <span>AI Interview Chat</span>
      </a>
      <div class="profile hidden" id="profileMenu"></div>
    </header>

    <div><a href="roles.html" class="btn btn-ghost btn-sm">← Return to roles</a></div>

    <h1 class="login-title">All accounts</h1>
    <div class="iv-scores hist-stats hidden" id="aStats"></div>
    <input class="role-search" id="aSearch" type="search" placeholder="Search by name or email" aria-label="Search accounts">
    <p class="body-lg center" id="aStatus">Loading accounts…</p>
    <button type="button" class="btn btn-accent btn-md hidden" id="aRetry">Try again</button>
    <div class="admin-wrap hidden" id="aWrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Email</th><th>Sign-in</th><th>Joined</th><th>Last login</th><th>Interviews</th></tr></thead>
        <tbody id="aBody"></tbody>
      </table>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="admin.js"></script>
</body>
</html>
